<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSGZ Liquid Glass · Optimized</title>
    <style>
        :root {
            --bg: #090b14;
            --purple: #8b5cf6;
            --blue: #4cc9ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            background: var(--bg);
            font-family: system-ui, sans-serif;
        }

        /* ── Hero ── */
        .hero {
            position: relative;
            width: min(560px, 92vw);
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 32px;
            background: var(--bg);
            isolation: isolate;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 0 40px rgba(139, 92, 246, 0.15),
                inset 0 0 60px rgba(0, 0, 0, 0.6);
            will-change: transform;
        }

        /* Aurora background – single layer, optimized */
        .hero::before {
            content: "";
            position: absolute;
            inset: -25%;
            background:
                radial-gradient(circle at 30% 35%, rgba(139, 92, 246, 0.3), transparent 35%),
                radial-gradient(circle at 70% 65%, rgba(76, 201, 255, 0.18), transparent 35%);
            filter: blur(50px);
            animation: auroraSlow 24s ease-in-out infinite alternate;
            z-index: 0;
            will-change: transform;
        }
        .hero::after {
            content: "";
            position: absolute;
            inset: -15%;
            background:
                radial-gradient(circle at 65% 75%, rgba(160, 120, 255, 0.15), transparent 40%),
                radial-gradient(circle at 25% 40%, rgba(76, 201, 255, 0.12), transparent 35%);
            filter: blur(40px);
            animation: auroraFast 16s ease-in-out infinite alternate;
            z-index: 0;
            will-change: transform;
        }

        @keyframes auroraSlow {
            from { transform: translate(-3%, -2%) rotate(2deg) scale(1); }
            to { transform: translate(3%, 2%) rotate(-2deg) scale(1.12); }
        }
        @keyframes auroraFast {
            from { transform: translate(2%, 1%) rotate(-1deg) scale(1.05); }
            to { transform: translate(-2%, -1%) rotate(3deg) scale(1.08); }
        }

        /* Grid mesh – very light, no animation for performance */
        .grid-mesh {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(circle, #000 55%, transparent 75%);
            opacity: 0.4;
            z-index: 1;
            pointer-events: none;
        }

        /* ── Orb wrapper ── */
        .orb-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 340px;
            display: grid;
            place-items: center;
            z-index: 2;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));
            will-change: transform;
        }

        .orb {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 18px rgba(132, 92, 255, 0.25))
                    drop-shadow(0 0 42px rgba(92, 170, 255, 0.2));
        }

        /* ── Organic bubble deformation ── */
        .bubble-deform {
            animation: bubbleBreath 6s ease-in-out infinite;
            transform-origin: center;
            will-change: transform;
        }
        @keyframes bubbleBreath {
            0%, 100% { transform: scale(1, 1) rotate(0deg); }
            25% { transform: scale(1.014, 0.986) rotate(0.3deg); }
            50% { transform: scale(0.992, 1.018) rotate(-0.4deg); }
            75% { transform: scale(1.008, 0.994) rotate(0.2deg); }
        }

        /* Glass shape animations */
        .glass-shape {
            animation:
                orbFloat 8s ease-in-out infinite,
                orbRotate 18s ease-in-out infinite;
            transform-origin: center;
            will-change: transform;
        }
        @keyframes orbFloat {
            50% { transform: translateY(-6px) scale(1.01); }
        }
        @keyframes orbRotate {
            50% { transform: rotate(2deg) translateY(-6px); }
        }

        /* ── HTML glass layers (overlays) ── */
        .glass-layer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            will-change: opacity, transform;
        }
        .layer-1 {
            background:
                radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.22), transparent 24%),
                linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
            mix-blend-mode: screen;
            filter: blur(0.3px);
        }
        .layer-2 {
            background:
                radial-gradient(circle at 72% 78%, rgba(76, 201, 255, 0.16), transparent 26%),
                radial-gradient(circle at 24% 76%, rgba(160, 120, 255, 0.08), transparent 28%);
            mix-blend-mode: screen;
            filter: blur(4px);
            opacity: 0.8;
        }
        .layer-3 {
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08) 0%, transparent 70%);
            mix-blend-mode: overlay;
            opacity: 0.5;
            filter: blur(10px);
            animation: causticPulse 6s ease-in-out infinite;
        }
        @keyframes causticPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.03); }
        }

        /* ── Edge refraction ── */
        .edge-refraction {
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03),
                0 0 14px rgba(132, 92, 255, 0.08),
                0 0 26px rgba(76, 201, 255, 0.06),
                inset 0 0 12px rgba(255, 255, 255, 0.05);
            pointer-events: none;
            backdrop-filter: blur(2px);
        }

        /* Inner caustic lights */
        .inner-caustic {
            position: absolute;
            width: 62%;
            height: 62%;
            left: 19%;
            top: 22%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 72%);
            filter: blur(16px);
            pointer-events: none;
            will-change: transform, opacity;
        }
        .caustic-1 {
            animation: causticMove1 9s ease-in-out infinite;
        }
        .caustic-2 {
            width: 45%;
            height: 45%;
            left: 28%;
            top: 28%;
            background: radial-gradient(circle, rgba(160, 120, 255, 0.15), transparent 70%);
            filter: blur(20px);
            animation: causticMove2 7s ease-in-out infinite 1.5s;
        }
        @keyframes causticMove1 {
            50% { transform: translateY(-8px) translateX(4px) scale(1.06); opacity: 0.7; }
        }
        @keyframes causticMove2 {
            50% { transform: translateY(6px) translateX(-4px) scale(1.1); opacity: 0.6; }
        }

        /* ── Soft sweeping reflection (controlled by JS) ── */
        .soft-sweep {
            position: absolute;
            left: -60%;
            top: -30%;
            width: 80%;
            height: 160%;
            background: radial-gradient(ellipse at center,
                rgba(255, 255, 255, 0.18) 0%,
                rgba(255, 255, 255, 0.05) 40%,
                transparent 70%);
            filter: blur(18px);
            transform: rotate(18deg);
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.9s ease;
            will-change: transform, opacity;
        }
        .soft-sweep.active {
            animation: softSweepAnim 2.4s ease-in-out forwards;
        }
        @keyframes softSweepAnim {
            0% {
                transform: translateX(-220%) rotate(18deg);
                opacity: 0;
            }
            20% {
                opacity: 0.55;
            }
            50% {
                transform: translateX(300%) rotate(18deg);
                opacity: 0.55;
            }
            80% {
                opacity: 0;
            }
            100% {
                transform: translateX(420%) rotate(18deg);
                opacity: 0;
            }
        }

        /* ── Logo ── */
        .logo-container {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            z-index: 20;
            filter: drop-shadow(0 0 12px rgba(139,92,246,0.25));
        }
        .logo {
            width: 92px;
            opacity: 0.96;
            animation: logoFloat 7s ease-in-out infinite;
            will-change: transform;
        }
        .logo-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(120, 92, 255, 0.28), transparent 70%);
            filter: blur(18px);
            z-index: -1;
            animation: glowPulse 4s ease-in-out infinite alternate;
        }
        .logo-reflection {
            position: absolute;
            top: 18px;
            left: 20px;
            width: 55px;
            height: 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            filter: blur(5px);
            transform: rotate(-18deg);
            opacity: 0.65;
        }
        @keyframes logoFloat {
            50% { transform: translateY(-4px) scale(1.02); }
        }
        @keyframes glowPulse {
            from { opacity: 0.65; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        /* ── Orbit satellites ── */
        .orbit-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 360px;
            height: 360px;
            transform: translate(-50%, -50%);
            animation: orbitSpin 42s linear infinite;
            pointer-events: none;
            will-change: transform;
        }
        .sat {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 6px #fff, 0 0 12px #8b5cf6;
            animation: satPulse 2.5s ease-in-out infinite alternate;
        }
        .sat.small {
            width: 4px;
            height: 4px;
            box-shadow: 0 0 5px #fff, 0 0 8px #4cc9ff;
        }
        .s1 { top: -3px; left: 50%; transform: translateX(-50%); }
        .s2 { right: -3px; top: 50%; transform: translateY(-50%); }
        .s3 { bottom: -3px; left: 50%; transform: translateX(-50%); }
        .s4 { left: -3px; top: 50%; transform: translateY(-50%); }
        .s5 { top: 15%; left: 85%; }
        .s6 { top: 85%; left: 15%; }
        .s7 { top: 15%; left: 15%; }
        .s8 { top: 85%; left: 85%; }

        @keyframes orbitSpin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes satPulse {
            from { opacity: 0.7; transform: scale(1); }
            to { opacity: 1; transform: scale(1.3); }
        }

        /* Dust – reduced count, smaller */
        .dust {
            position: absolute;
            border-radius: 50%;
            background: white;
            opacity: 0.2;
            animation: dustFloat 8s ease-in-out infinite;
            pointer-events: none;
        }
        .dust-large { width: 5px; height: 5px; filter: blur(1px); }
        .dust-medium { width: 3px; height: 3px; }
        .dust-small { width: 2px; height: 2px; }
        @keyframes dustFloat {
            50% { opacity: 0.55; transform: translateY(-14px); }
        }

        /* Vignette */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 55%, rgba(0, 0, 0, 0.38));
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="grid-mesh"></div>

        <!-- Logo -->
        <div class="logo-container">
            <div class="logo-glow"></div>
            <img class="logo" src="/storage/emulated/0/Pictures/Gallery/owner/Blue Print/logo.png" alt="LSGZ">
            <div class="logo-reflection"></div>
        </div>

        <!-- Vignette -->
        <div class="vignette"></div>

        <!-- Orb and Glass Layers -->
        <div class="orb-wrapper">
            <svg class="orb" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
                        <stop offset="35%" stop-color="rgba(255,255,255,0.09)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
                    </linearGradient>
                    <radialGradient id="edgeGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
                        <stop offset="65%" stop-color="#9b7cff" stop-opacity="0.1" />
                        <stop offset="100%" stop-color="#49cfff" stop-opacity="0" />
                    </radialGradient>
                </defs>
                <g class="bubble-deform">
                    <path class="glass-shape"
                          d="M250 48
                             C356 42 438 124 432 232
                             C425 342 343 430 248 438
                             C132 446 56 350 58 236
                             C60 118 144 52 250 48Z"
                          fill="url(#glassFill)"
                          stroke="rgba(255,255,255,0.18)"
                          stroke-width="1.4" />
                    <ellipse cx="170" cy="145" rx="82" ry="22"
                             fill="rgba(255,255,255,0.18)"
                             transform="rotate(-16 170 145)" />
                    <ellipse cx="185" cy="140" rx="45" ry="12"
                             fill="rgba(255,255,255,0.22)"
                             transform="rotate(-16 185 140)"
                             filter="blur(2px)" />
                    <ellipse cx="315" cy="335" rx="66" ry="60"
                             fill="rgba(70,170,255,0.14)" />
                    <circle cx="250" cy="250" r="188"
                            fill="url(#edgeGlow)"
                            opacity="0.75" />
                </g>
            </svg>

            <!-- Glass overlays -->
            <div class="glass-layer layer-1"></div>
            <div class="glass-layer layer-2"></div>
            <div class="glass-layer layer-3"></div>

            <!-- Dust motes -->
            <div class="dust dust-large" style="left:18%; top:28%; animation-delay:0s"></div>
            <div class="dust dust-medium" style="left:70%; top:18%; animation-delay:2s"></div>
            <div class="dust dust-small" style="left:25%; top:74%; animation-delay:5s"></div>
            <div class="dust dust-medium" style="left:58%; top:82%; animation-delay:1.5s"></div>
            <div class="dust dust-small" style="left:85%; top:40%; animation-delay:4.2s"></div>

            <!-- Soft sweep reflection (controlled by JS) -->
            <div class="soft-sweep" id="softSweep"></div>

            <!-- Edge refraction -->
            <div class="edge-refraction"></div>

            <!-- Inner caustics -->
            <div class="inner-caustic caustic-1"></div>
            <div class="inner-caustic caustic-2"></div>

            <!-- Orbiting satellites -->
            <div class="orbit-system">
                <div class="sat s1"></div>
                <div class="sat s2"></div>
                <div class="sat s3"></div>
                <div class="sat s4"></div>
                <div class="sat small s5"></div>
                <div class="sat small s6"></div>
                <div class="sat small s7"></div>
                <div class="sat small s8"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const sweep = document.getElementById('softSweep');
            if (!sweep) return;

            function triggerSweep() {
                // Remove and re-add the active class to restart the animation
                sweep.classList.remove('active');
                void sweep.offsetWidth; // force reflow
                sweep.classList.add('active');

                // Schedule next sweep with random delay between 5 and 9 seconds
                const delay = 5000 + Math.random() * 4000; // 5–9 sec
                setTimeout(triggerSweep, delay);
            }

            // Start the first sweep after a short initial delay
            setTimeout(triggerSweep, 1000);
        })();
    </script>
</body>
</html>
