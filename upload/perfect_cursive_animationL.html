<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursive L - Single Sweep</title>
<style>
  body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;overflow:hidden}
  .container{width:90%;max-width:1200px}
  svg{width:100%;height:auto;filter:drop-shadow(0 0 10px rgba(186,0,255,.5))}
  #l-base{fill:transparent;stroke:url(#gradient);stroke-width:150;opacity:1}
  #l-base.draw-anim{transition:stroke-dashoffset 1s ease-in-out}
  #l-base.faded{transition:opacity 1.5s ease-in-out,fill 1s ease-in-out;fill:url(#gradient);opacity:.25}
  #l-sweep{
    fill:none; stroke:url(#trail); stroke-width:180;
    stroke-linecap:round; stroke-linejoin:round; opacity:0;
    filter:drop-shadow(0 0 14px #ff33cc) drop-shadow(0 0 24px #fff);
  }
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 26880 11520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d400ff"/><stop offset="50%" stop-color="#ba00ff"/><stop offset="100%" stop-color="#7a00ff"/>
    </linearGradient>
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff33cc" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ff33cc" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ff33cc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff33cc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,11520) scale(1,-1)">

  </g>
</svg>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const base = document.getElementById('l-base');
  const sweep = document.getElementById('l-sweep');

  // draw base
  const Lb = base.getTotalLength();
  base.style.strokeDasharray = Lb;
  base.style.strokeDashoffset = Lb;
  requestAnimationFrame(()=>{ base.classList.add('draw-anim'); base.style.strokeDashoffset = 0; });
  setTimeout(()=>base.classList.add('faded'),1000);

  // single smooth sweep
  const Ls = sweep.getTotalLength();
  const seg = Ls * 0.06; // comet length
  sweep.style.strokeDasharray = `${seg} ${Ls}`;

  function doSweep(){
    sweep.style.opacity = '1';
    sweep.style.transition = 'none';
    sweep.style.strokeDashoffset = Ls + seg; // start off left
    sweep.getBoundingClientRect();
    requestAnimationFrame(()=>{
      sweep.style.transition = 'stroke-dashoffset 5s linear'; // slow, smooth
      sweep.style.strokeDashoffset = -seg; // end off right
    });
    // fade out BEFORE reset - no visible return
    setTimeout(()=>{
      sweep.style.transition = 'opacity 0.4s';
      sweep.style.opacity = '0';
    }, 4900);
  }
  function schedule(){ setTimeout(doSweep, 5000 + Math.random()*4000); setTimeout(schedule, 10000); }
  setTimeout(schedule, 2500);
});
</script>
</body>
</html>
